name: Keep app awake

on:
  schedule:
    # Every 6 hours, off the hour (GitHub delays jobs queued at :00). The app sleeps after ~12h idle,
    # and scheduled runs often start late, so 10h between visits left no margin.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}       # lets you also trigger it by hand from the Actions tab

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # A real browser session, not curl: curl never got past Streamlit Cloud's cookie redirect
      # (exit 47), and a plain page fetch doesn't count as app activity anyway. Wakes it if asleep.
      - name: Open the dashboard like a viewer
        run: python .github/scripts/keep_alive.py "https://kimirica-exec-dashboardgit-fryjcdfq4rjxcyvsctdpyq.streamlit.app/"

      - name: Keep a screenshot if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-failure
          path: keep_alive_failure.png
          if-no-files-found: ignore
