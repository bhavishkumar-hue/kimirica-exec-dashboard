name: Keep app awake

on:
  schedule:
    - cron: "0 */10 * * *"   # visits at 00:00, 10:00, 20:00 UTC -- never more than 10h apart
  workflow_dispatch: {}       # lets you also trigger it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the dashboard
        # --retry: a Streamlit Cloud redeploy (triggered by every push) briefly refuses
        # connections while it restarts -- without a retry, a ping landing in that window fails
        # the whole job and emails a false-alarm failure notice instead of just trying again.
        run: |
          curl -sSL --max-time 30 --retry 3 --retry-delay 10 --retry-connrefused \
            -o /dev/null -w "HTTP %{http_code}\n" \
            -A "Mozilla/5.0 (keep-alive ping; +https://github.com/${{ github.repository }})" \
            "https://kimirica-exec-dashboardgit-fryjcdfq4rjxcyvsctdpyq.streamlit.app/"
