name: Keep app awake

on:
  schedule:
    - cron: "0 */10 * * *"   # visits at 00:00, 10:00, 20:00 UTC -- never more than 10h apart
  workflow_dispatch: {}       # lets you also trigger it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the dashboard
        run: |
          curl -sSL --max-time 30 -o /dev/null -w "HTTP %{http_code}\n" \
            -A "Mozilla/5.0 (keep-alive ping; +https://github.com/${{ github.repository }})" \
            "https://kimirica-exec-dashboardgit-fryjcdfq4rjxcyvsctdpyq.streamlit.app/"
