name: Data health check

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST daily
  workflow_dispatch: {}     # lets you also trigger it by hand from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r kimirica_exec/requirements.txt

      - name: Write BigQuery service-account key
        run: echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Run data health check
        working-directory: kimirica_exec
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python check_alerts.py
